name: CI — tests & deployment check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  deployment-check:
    name: Verify env / health / webhook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Enabled by setting the APP_URL repository variable and the
    # TELEGRAM_BOT_TOKEN secret (see the README's CI section). The check step
    # below is skipped until both are configured.
    # NOTE: the `secrets` context is not allowed in `if:` expressions, so both
    # values are copied into step-level env vars and checked via `env.` there.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The checklist script is pure-stdlib: no dependency install needed.
      # --expect-commit <SHA> --wait 600 polls /api/health until Vercel finishes
      # building and serves the exact commit being pushed, so the checks can
      # never validate the previous deployment. --fix --yes re-registers the
      # webhook automatically when it is misconfigured (only after the app's
      # health check passes and the expected deployment is live).
      - name: Run deployment checklist (wait for deploy, auto-fix webhook)
        if: env.DATG_APP_URL != '' && env.DATG_BOT_TOKEN != ''
        env:
          DATG_APP_URL: ${{ vars.APP_URL }}
          DATG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: >-
          python scripts/check_deployment.py
          --url "${{ env.DATG_APP_URL }}"
          --expect-commit "${{ github.sha }}"
          --wait 600
          --fix --yes
